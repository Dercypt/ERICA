name: Android test APK

# Builds an installable APK for on-device testing (docs/ADVERSARIAL_DEVICE_TESTING.md).
# It is a release build, so the JS bundle is inside and it runs without a Metro server, but it
# is signed with the throwaway debug keystore in android/app: for testers only, never for
# distribution.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # *.keystore is gitignored, so make a throwaway key matching the debug signingConfig in
      # android/app/build.gradle. It differs per run: uninstall the old APK before installing
      # a newer one.
      - name: Create throwaway signing key
        run: >
          keytool -genkeypair -keystore android/app/debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=ERICA test build,O=ERICA,C=US"
      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: erica-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
